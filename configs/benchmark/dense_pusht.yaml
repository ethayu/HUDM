output_dir: rollouts/mwm_dense_pusht
title: Dense-Level MWM vs Upstream Le-WM on PushT
env_id: swm/PushT-v1
seed: 42
eval_config: configs/eval/paper_pusht.yaml
manifest:
  config: configs/manifest/pusht_paper_seed42.yaml
runs:
  - name: upstream
    role: upstream_lewm_converted
    checkpoint: checkpoints_mwm/upstream_lewm_pusht
  - name: dense
    role: mwm_dense
    checkpoint: checkpoints_mwm/mwm_dense_pusht
    planner:
      scheduler:
        enabled: true
        mpc:
          mode: fixed
          level: finest
        cem:
          mode: linear
          start_level: coarsest
          end_level: finest
        rollout:
          mode: fixed
          level: base
