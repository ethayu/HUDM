# Extends the dense-matched-K line below K=96 for the horizon5/n200
# individual-vs-dense-matched-K comparison plot. The paper10 dense checkpoint
# (mwm_paper10_reacher_k96_120_144_168_192_release20260728) has no K<96
# levels, so this uses checkpoints_mwm/mwm_dense_reacher (K=[6,12,48,96,144,192])
# instead, for its K=6/12/48 levels only (K=96/144/192 already covered by the
# paper10 checkpoint in release20260728_reacher_goal25_k_matched_comparison_horizon5_n200.yaml
# -- this is a DIFFERENT checkpoint, included for reference alongside those,
# not a replacement).
#
# Same eval protocol: horizon=5/receding_horizon=5, pop=300/elite=0.1/n_iter=10,
# goal_offset=25, 200 episodes, same n=200 manifest.
output_dir: reports/research/release20260728_reacher_goal25_mwm_dense_reacher_low_k_horizon5_n200
title: Release 2026-07-28 Reacher Goal25 -- mwm_dense_reacher Low-K (6/12/48), Horizon5, N=200
env_id: swm/ReacherDMControl-v0
seed: 42
eval_config: configs/eval/paper_reacher.yaml
manifest:
  config: configs/manifest/release20260728_reacher_goal25_exact_seed42_n200.yaml

run_defaults:
  eval:
    episodes: 200
    num_envs: 50
    goal_offset: 25
    goal_indexing: exact
    budget: 50
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5
    pop_size: 300
    elite_frac: 0.1
    n_iter: 10

runs:
  - name: mwm_dense_reacher_k6
    role: reacher_goal25_mwm_dense_reacher_k6_horizon5_n200
    checkpoint: &mwm_dense_reacher_checkpoint checkpoints_mwm/mwm_dense_reacher
    schedule: "mwm_dense_reacher checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=6 (level 0) | horizon=5, n=200"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 0}
        cem: {mode: fixed, level: 0}
        rollout: {mode: fixed, level: 0}

  - name: mwm_dense_reacher_k12
    role: reacher_goal25_mwm_dense_reacher_k12_horizon5_n200
    checkpoint: *mwm_dense_reacher_checkpoint
    schedule: "mwm_dense_reacher checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=12 (level 1) | horizon=5, n=200"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 1}
        cem: {mode: fixed, level: 1}
        rollout: {mode: fixed, level: 1}

  - name: mwm_dense_reacher_k48
    role: reacher_goal25_mwm_dense_reacher_k48_horizon5_n200
    checkpoint: *mwm_dense_reacher_checkpoint
    schedule: "mwm_dense_reacher checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=48 (level 2) | horizon=5, n=200"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 2}
        cem: {mode: fixed, level: 2}
        rollout: {mode: fixed, level: 2}
