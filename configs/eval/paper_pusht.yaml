checkpoint:
  run_dir: checkpoints_mwm/upstream_lewm_pusht
  epoch: null
env_id: swm/PushT-v1
data:
  # Stable-WM's current default data path is Lance. This matches the upstream
  # Le-WM training/eval representation used by the paper-parity check.
  path: data/upstream/pusht_expert_train.lance
  format: lance
  split_ratio: 0.9
  pixels_key: pixels
  action_key: action
  keys_to_cache: [action, proprio, state]
  action_preprocessing: standard_scaler
eval:
  episodes: 50
  goal_offset: 25
  seed: 42
  budget: 50
  num_envs: 50
  output_path: rollouts/mwm_paper_parity/pusht_upstream/eval.json
  manifest_path: null
  sampling: stable_worldmodel
  write_manifest_path: rollouts/mwm_paper_parity/pusht_seed42_manifest.json
  save_video: false
  video_path: rollouts/mwm_paper_parity/pusht_videos
env:
  max_episode_steps: 100
  goal_conditioned: true
  kwargs: {}
restore:
  import_path: null
planner:
  horizon: 5
  receding_horizon: 5
  action_block: 5
  batch_size: 1
  pop_size: 300
  topk: 30
  elite_frac: 0.1
  n_iter: 30
  init_std: 1.0
  seed: 42
  warm_start: true
  clamp_actions: false
  std_unbiased: true
  scheduler:
    policy: fixed
    level: finest
    rollout_level:
      mode: fixed
      level: base
device: auto
