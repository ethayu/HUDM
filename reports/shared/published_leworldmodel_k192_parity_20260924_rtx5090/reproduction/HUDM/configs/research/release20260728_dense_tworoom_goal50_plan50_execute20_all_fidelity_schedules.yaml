# Run 00 is the converted upstream TwoRoom baseline. The source TSV contains 26
# schedule rows (rather than 25), kept below in source order. A dash means that
# the conceptual outer axis is not varied; the runtime representation still
# supplies the required fixed stage.
output_dir: reports/research/release20260728_dense_tworoom_goal50_plan50_execute20_all_fidelity_schedules
title: Release 2026-07-28 Dense TwoRoom Goal50 Plan50 Execute20 All-Axis Fidelity Schedule Matrix
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/tworoom_paper_seed42_goal50_exact.yaml

# Every base run below is evaluated over 120 valid planner cells: the 125-cell
# Cartesian product minus the five topk=1 cells excluded below. The audited
# dynamics FLOP count is the default cost axis in the Pareto view.
run_defaults:
  eval:
    episodes: 250
    num_envs: 50
    goal_offset: 50
    goal_indexing: exact
    budget: 100
  planner:
    flop_accounting: dynamics_audit
    # Ten model steps x five primitive actions per block = a 50-action plan.
    # Execute four blocks (20 primitive actions) before replanning.
    horizon: 10
    receding_horizon: 4
    action_block: 5
sweep:
  planner.pop_size: [20, 50, 100, 150, 200]
  planner.elite_frac: [0.05, 0.1, 0.2, 0.3, 0.5]
  planner.n_iter: [5, 10, 15, 20, 30]

# pop_size=20 and elite_frac=0.05 resolve to one elite. With the paper
# planner's std_unbiased=true, a one-sample standard deviation is undefined.
sweep_exclude:
  - planner.pop_size: 20
    planner.elite_frac: 0.05

runs:
