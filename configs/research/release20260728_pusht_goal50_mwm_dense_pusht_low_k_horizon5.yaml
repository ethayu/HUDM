# PushT counterpart of the tworoom/ogb_cube/reacher mwm_dense low-K comparison,
# goal_offset=50. Extends the dense-matched-K line below K=96 using
# checkpoints_mwm/mwm_dense_pusht (K=[6,12,48,96,144,192]) for its K=6/12/48 levels.
# Same CEM protocol as PushT's existing k_matched_comparison_horizon5 config
# (n_iter=30, unlike the other envs' n_iter=10) so the curves stay comparable.
output_dir: reports/research/release20260728_pusht_goal50_mwm_dense_pusht_low_k_horizon5
title: Release 2026-07-28 PushT Goal50 -- mwm_dense_pusht Low-K (6/12/48), Horizon5, N=100
env_id: swm/PushT-v1
seed: 42
eval_config: configs/eval/paper_pusht.yaml
manifest:
  config: configs/manifest/pusht_paper_seed42_goal50_exact.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 50
    goal_indexing: exact
    budget: 100
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5
    pop_size: 300
    elite_frac: 0.1
    n_iter: 30

runs:
  - name: mwm_dense_pusht_k6
    role: pusht_goal50_mwm_dense_pusht_k6_horizon5
    checkpoint: &mwm_dense_pusht_checkpoint checkpoints_mwm/mwm_dense_pusht
    schedule: "mwm_dense_pusht checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=6 (level 0) | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 0}
        cem: {mode: fixed, level: 0}
        rollout: {mode: fixed, level: 0}

  - name: mwm_dense_pusht_k12
    role: pusht_goal50_mwm_dense_pusht_k12_horizon5
    checkpoint: *mwm_dense_pusht_checkpoint
    schedule: "mwm_dense_pusht checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=12 (level 1) | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 1}
        cem: {mode: fixed, level: 1}
        rollout: {mode: fixed, level: 1}

  - name: mwm_dense_pusht_k48
    role: pusht_goal50_mwm_dense_pusht_k48_horizon5
    checkpoint: *mwm_dense_pusht_checkpoint
    schedule: "mwm_dense_pusht checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=48 (level 2) | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 2}
        cem: {mode: fixed, level: 2}
        rollout: {mode: fixed, level: 2}
