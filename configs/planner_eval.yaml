planner_eval:
  plan_config: "configs/plan.yaml"
  seed: 0
  num_rollouts: 4
  sample_without_replacement: true
  output_root: "rollouts"
  parallel:
    mode: "auto"  # auto -> wm_batch for wm, process otherwise
    max_workers: 2
    wm_schedule_batch_size: 0  # 0 => use all schedules
  schedules:
    - name: "finest_fixed"
      fidelity:
        mpc:
          mode: "fixed"
          level: "finest"
        cem:
          mode: "fixed"
          level: "base"
        rollout:
          mode: "fixed"
          level: "base"
    - name: "coarse_to_fine"
      fidelity:
        mpc:
          mode: "linear"
          start_level: "coarsest"
          end_level: "finest"
        cem:
          mode: "linear"
          start_level: "base"
          end_level: "finest"
        rollout:
          mode: "fixed"
          level: "base"
