checkpoint:
  run_dir: checkpoints_mwm/upstream_lewm_reacher
  epoch: null
env_id: swm/ReacherDMControl-v0
data:
  path: data/upstream/reacher.lance
  format: lance
  split_ratio: 0.9
  pixels_key: pixels
  action_key: action
  keys_to_load: [pixels, action, qpos, qvel, observation]
  keys_to_cache: [action, qpos, qvel, observation]
  action_preprocessing: standard_scaler
eval:
  episodes: 50
  goal_offset: 25
  goal_indexing: upstream_lewm_end_exclusive
  seed: 42
  budget: 50
  num_envs: 50
  output_path: rollouts/mwm_public_lewm_parity/reacher_upstream/eval.json
  manifest_path: null
  sampling: upstream_lewm
  write_manifest_path: rollouts/mwm_public_lewm_parity/reacher_seed42_manifest.json
  save_video: false
  video_path: rollouts/mwm_public_lewm_parity/reacher_videos
env:
  max_episode_steps: 100
  goal_conditioned: true
  kwargs:
    task: qpos_match
  runtime:
    # Current packaged Stable WorldModel semantics. Keep explicit so dependency
    # upgrades cannot silently change the public-code comparison again.
    reacher_qpos_threshold: 0.05
restore:
  import_path: mwm.swm.restore.reacher_qpos_match_restore_spec
planner:
  # Reproduce initial LeWM jepa.py's growing-prefix action embedding order.
  rollout_semantics: upstream_lewm_historical
  policy_semantics: upstream_lewm_historical
  horizon: 5
  receding_horizon: 5
  action_block: 5
  batch_size: 1
  pop_size: 300
  topk: 30
  elite_frac: 0.1
  # The initial and current public LeWM solver/cem.yaml use 30 iterations for
  # every environment. Keep this separate from paper_reacher.yaml's 10.
  n_iter: 30
  init_std: 1.0
  seed: 42
  warm_start: true
  clamp_actions: false
  std_unbiased: true
  scheduler:
    enabled: true
    mpc:
      mode: fixed
      level: finest
    cem:
      mode: fixed
      level: base
    rollout:
      mode: fixed
      level: base
device: auto
