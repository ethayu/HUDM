  - name: 01_rollout_fixed
    role: release20260728_goal50_plan50_execute20_dense_schedule_01_rollout_fixed
    checkpoint: &dense_tworoom_checkpoint checkpoints_mwm/mwm_paper10_tworoom_k96_120_144_168_192_release20260728
    schedule: "MPC=- | CEM=- | Rollout=fixed"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: fixed, level: base}

  - name: 02_rollout_fine_to_coarse
    role: release20260728_goal50_plan50_execute20_dense_schedule_02_rollout_fine_to_coarse
