plan:
  backend: "gt_env"   # wm | gt_env | particle_sim
  env_id: "pusht"

  env:
    with_velocity: true
    with_target: true
    add_noise: 0
    noise_std: [0.5, 0.5]
    render_size: 512

  world_model:
    # Optional override. If null, the planner loads world.yaml from run_dir
    # (or from the first ensemble member).
    config_path: null
    run_dir: "/home/aurora/HUDM-mwm/checkpoints_world/world_baseline_20260213_235405"
    epoch: 200
    checkpoint_root: "/home/aurora/HUDM-mwm/checkpoints_world"
    device: "auto"   # auto | cpu | cuda
    ensemble:
      enabled: false
      run_dirs: []    # when enabled, provide >=2 run directories

  mpc:
    steps: 15
    horizon: 15
    replan_every: 15

  cem:
    pop_size: 100
    elite_frac: 0.3
    n_iter: 5
    init_std: 1.0
    warm_start: true
    action_low: null
    action_high: null

  objective:
    latent_metric: "l2"      # l1 | l2
    terminal_weight: 1.0
    running_weight: 0.0
    action_l2_weight: 0.1
    # gt_env backend costs (final-state objective):
    eef_weight: 1.0
    block_pos_weight: 1.0
    block_angle_weight: 0.1
    state_l2_weight: 0.0

  # Fidelity schedules are discrete over level indices in model.K:
  # 0 = coarsest level, len(K)-1 = finest level.
  # Use integer indices or tokens:
  # - "coarsest", "finest" for any stage
  # - "base" for CEM/rollout fields
  #   * in CEM fields: resolves to the current MPC-stage level
  #   * in rollout fields: resolves to the current CEM-iteration level
  fidelity:
    enabled: true
    num_levels: 12   # used by gt_env / particle_sim backends; wm backend uses len(model.K)
    mpc:
      mode: "linear"            # fixed | linear
      level: "finest" #"finest"          # used when mode=fixed
      start_level: 0   # used when mode=linear
      end_level: 3       # used when mode=linear
    cem:
      mode: "linear"            # fixed | linear
      level: "base"             # used when mode=fixed
      start_level: "base"       # used when mode=linear
      end_level: "finest"       # used when mode=linear
    rollout:
      mode: "fixed"        # fixed | linear | uncertainty_downshift
      level: "base"        # used when mode=fixed
      start_level: "base"  # used when mode=linear
      end_level: "coarsest" # used when mode=linear
      uncertainty:
        criterion: "mean"  # mean | percentile
        threshold: 0.05
        percentile: 0.8
        min_level: "coarsest"
        max_downshifts_per_step: 1

  gt_env:
    rollout_samples: 1
    objective_space: "state"  # image | state
    progress: true            # per-CEM-iteration rollout progress bar
    progress_leave: false     # keep bars after completion
    fidelity_env:
      mode: "blur_avgpool"      # blur_avgpool | blur_quantize
      blur_sigma_max: 2.0
      pool_scale_max: 4
      quantize_levels_min: 8
      quantize_levels_max: 256
      action_noise_std_max: 0.0
      downsample_output: true
      min_downsample_size: 12

  particle_env:
    rollout_samples: 1
    objective_space: "state"   # image | state
    progress: true             # per-CEM-iteration rollout progress bar
    progress_leave: false      # keep bars after completion
    fidelity_env:
      # Coarsest -> finest (larger spacing => fewer particles).
      spacings: [0.1, 0.09, 0.08, 0.07, 0.06, 0.05, 0.04, 0.03, 0.020, 0.016, 0.013, 0.010]
      device: "auto"           # auto | cpu | cuda | cuda:0
      xmin: -0.25
      xmax: 0.25
      ymin: -0.25
      ymax: 0.25
      min_particles: 1
      coarsest_single_particle: true
      particle_radius: null      # null => auto-scale particle radius with level/N
      radius_scale: 1.0
      radius_clip_spacing: false
      stem_w: 0.05
      stem_h: 0.10
      bar_w: 0.12
      bar_h: 0.04
      pusher_radius: 0.015
      pusher_speed: 0.6
      pusher_interp_substeps: true
      frame_dt: 0.0166666667
      substeps: 16
      iters: 8
      mu: 0.6
      contact_alpha: 0.35
      ground_friction_accel: 1000000.0
      rest_speed_eps: 0.5
      lin_damp: 0.995
      vel_damp: 0.999
      alpha_rigid: 1.0

  init_goal:
    source: "dataset"      # random | dataset
    dataset:
      zarr_path:  "/Users/ethanyu/VSCodeProjects/HUDM/synthetic/pusht_synth.zarr"     # if null, falls back to world_model config data.zarr_path
      split: "valid"
      split_ratio: null   # if null, uses world split ratio (or 0.8 without world config)
      trajectory_len: 15
      seed: 50
      reconstruct_goal_state: 3   # 0: use stored goal state, 1: assert reconstructed==stored, 2: use reconstructed, 3: force replay trajectory as GT

  render: true
  save: true
