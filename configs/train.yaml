seed: 42

train:
  batch_size: 1000
  epochs: 20
  learning_rate: 0.0005
  no_cuda: false
  log_file: logs/train.log
  num_workers: 4
  checkpoint_dir: checkpoints
  max_mask_prob: 0.5          # final mask probability
  mask_warmup_epochs: 10      # linear ramp length

data:
  path: "/home/aurora/handful-of-trials-pytorch/pusht_dataset"
  n_rollout: 20000
  normalize_action: true
  split_ratio: 0.8
  train_frac: 0.8
  num_hist: 8
  frameskip: 1
  with_velocity: true
  use_sincos: true


model:
  # ensemble
  num_models: 5             # usual for reliable variance

  # I/O dimensions
  state_dim: 8
  action_dim: 2

  # transformer backbone
  embedding_dim: 4
  n_heads: 2         
  n_layers: 2                
  feedforward_dim: 16        
  dropout: 0.1

  var_threshold: 0.25         # start by dropping dims when ensemble σ² > 0.25

wandb:
  enable: true
  project: "gnn-dynamics"
  run_name: "masked-dynamics-experiment"
