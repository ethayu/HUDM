# GPU0 half of the remaining epochs to complete the full 10-epoch x 5-level
# sweep for mwm_paper10_tworoom_k96_120_144_168_192_sepopt_retrain_20260916.
# epoch3/6/9 already covered in tworoom_goal25_k96to192_retrain_epoch3_6_9_*
# and tworoom_goal25_k96to192_retrain_epoch9only_*. This file covers epochs
# 0,1,2,4; the CPU-parallel file covers epochs 5,7,8. Same protocol:
# horizon=5/receding_horizon=5, pop=300/elite_frac=0.1/n_iter=10,
# goal_offset=25, 100 episodes.
output_dir: reports/research/tworoom_goal25_k96to192_retrain_epoch0_1_2_4_alllevels_horizon5_n100
title: TwoRoom Goal25 -- mwm_paper10_tworoom_k96_120_144_168_192_sepopt_retrain_20260916, epochs 0/1/2/4, All Levels, Horizon5, N=100
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/release20260728_tworoom_goal25_exact_seed42.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 25
    goal_indexing: exact
    budget: 50
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5
    pop_size: 300
    elite_frac: 0.1
    n_iter: 10

