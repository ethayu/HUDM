# Isolates a confound in comparing the "winning adaptive schedule" (98%
# success at pop=50/n_iter=10, 16.1M bits/ep) against dense_matched_k96
# (97% success at pop=300/n_iter=10, 92.16M bits/ep): the adaptive schedule
# used much cheaper CEM settings, so its bit-efficiency "win" could be purely
# because K=96 doesn't need much CEM budget at all -- nothing to do with
# fidelity scheduling.
#
# This tests fixed K=96 (dense checkpoint, NO scheduling, all three planner
# axes pinned to level 0) at the SAME cheap CEM setting (pop=50, n_iter=10)
# as the winning adaptive schedule, same horizon=2/receding_horizon=2/
# goal_offset=25 as release20260728_tworoom_goal25_k_matched_comparison.yaml.
output_dir: reports/research/release20260728_tworoom_goal25_debug_densek96_cheap_cem
title: Release 2026-07-28 TwoRoom Goal25 Debug -- Dense K96, Cheap CEM (pop=50, matches best adaptive schedule cost)
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/release20260728_tworoom_goal25_exact_seed42.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 25
    goal_indexing: exact
    budget: 50
  planner:
    flop_accounting: dynamics_audit
    horizon: 2
    receding_horizon: 2
    action_block: 5
    pop_size: 50
    elite_frac: 0.1
    n_iter: 10

runs:
  - name: densek96_cheap_cem
    role: tworoom_goal25_densek96_cheap_cem
    checkpoint: checkpoints_mwm/mwm_paper10_tworoom_k96_120_144_168_192_release20260728
    schedule: "dense K=[96,120,144,168,192] checkpoint | MPC/CEM/Rollout all fixed at K=96 (level 0) | cheap CEM pop=50 n_iter=10"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 0}
        cem: {mode: fixed, level: 0}
        rollout: {mode: fixed, level: 0}
