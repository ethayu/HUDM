# Goal50 counterpart of release20260728_tworoom_goal25_densek96_fixed_cem_grid.yaml,
# at horizon=4/receding_horizon=4 -- matching the horizon already used by the
# existing goal50 all-fidelity sweep (release20260728_dense_tworoom_goal50_plan100_execute20_all_fidelity_schedules.yaml),
# so results are directly comparable to that sweep.
#
# Same pop_size x n_iter grid (25 combos), fixed K=96 (dense checkpoint,
# level 0), no scheduling at all -- to compare against a representative
# adaptive-schedule sweep at the same goal50/horizon=4 settings
# (release20260728_tworoom_goal50_representative_schedules_horizon4.yaml).
output_dir: reports/research/release20260728_tworoom_goal50_densek96_fixed_cem_grid_horizon4
title: Release 2026-07-28 TwoRoom Goal50 -- Fixed K=96 (Dense Checkpoint) CEM Grid, Horizon4
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/tworoom_paper_seed42_goal50_exact.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 50
    goal_indexing: exact
    budget: 100
  planner:
    flop_accounting: dynamics_audit
    horizon: 4
    receding_horizon: 4
    action_block: 5

sweep:
  planner.pop_size: [20, 50, 100, 150, 200]
  planner.elite_frac: [0.1]
  planner.n_iter: [5, 10, 15, 20, 30]
sweep_exclude:
  - planner.pop_size: 20
    planner.elite_frac: 0.05
  # High-cost pop_size x n_iter corners pruned as far-right outliers (bits/episode
  # roughly 1.3-2x the next tier down in every release20260728 sweep) -- see
  # release20260728_dense_reacher_all_fidelity_schedules.yaml for the analysis.
  - planner.pop_size: 200
    planner.n_iter: 30
  - planner.pop_size: 150
    planner.n_iter: 30
  - planner.pop_size: 200
    planner.n_iter: 20

runs:
  - name: densek96_fixed
    role: tworoom_goal50_densek96_fixed_horizon4
    checkpoint: checkpoints_mwm/mwm_paper10_tworoom_k96_120_144_168_192_release20260728
    schedule: "dense K=[96,120,144,168,192] checkpoint | MPC/CEM/Rollout all fixed at K=96 (level 0), no transitions | horizon=4"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 0}
        cem: {mode: fixed, level: 0}
        rollout: {mode: fixed, level: 0}
