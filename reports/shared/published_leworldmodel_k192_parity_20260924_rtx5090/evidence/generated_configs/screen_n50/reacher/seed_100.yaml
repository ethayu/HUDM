output_dir: reports/research/k192_sepopt_published_parity_20260924/screen_n50/reacher/seed_100
title: Reacher published LeWorldModel vs September K=192 sepopt baseline (evaluation
  seed 100, n=50)
env_id: swm/ReacherDMControl-v0
seed: 100
eval_config: configs/eval/paper_reacher.yaml
manifest:
