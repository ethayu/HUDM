# Representative subset (6 of the 26 dense/adaptive schedule shapes from
# release20260728_dense_tworoom_all_fidelity_schedules.yaml) x the same
# pop_size x n_iter grid (25 combos) = 150 runs, at goal_offset=50/horizon=5,
# to check whether the "fixed K=96 essentially matches the best adaptive
# schedule" finding from goal25/horizon=2 also holds at a harder task and a
# different horizon -- without the cost of the full 26-schedule x 25-combo
# (650-run) sweep.
#
# The 6 schedules were chosen to span every distinct axis-transition pattern
# seen in the full 26: pure single-axis transitions (rollout-only,
# CEM-only), fixed-MPC with a low-K rollout endpoint, multi-axis
# transitions, and the single schedule that won the goal25/horizon=2 pooled
# frontier (02_rollout_fine_to_coarse).
output_dir: reports/research/release20260728_tworoom_goal50_representative_schedules_horizon5
title: Release 2026-07-28 TwoRoom Goal50 -- Representative Adaptive Schedules, Horizon5
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/tworoom_paper_seed42_goal50_exact.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 50
    goal_indexing: exact
    budget: 100
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5

sweep:
  planner.pop_size: [20, 50, 100, 150, 200]
  planner.elite_frac: [0.1]
  planner.n_iter: [5, 10, 15, 20, 30]
sweep_exclude:
  - planner.pop_size: 20
    planner.elite_frac: 0.05

runs:
  - name: 02_rollout_fine_to_coarse
    role: tworoom_goal50_horizon5_02_rollout_fine_to_coarse
    checkpoint: &dense_tworoom_checkpoint checkpoints_mwm/mwm_paper10_tworoom_k96_120_144_168_192_release20260728
    schedule: "MPC=- | CEM=- | Rollout=fine -> coarse | horizon=5 (winner of the goal25/horizon=2 pooled frontier)"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: linear, start_level: finest, end_level: coarsest}

  - name: 06_cem_coarse_to_fine_rollout_base
    role: tworoom_goal50_horizon5_06_cem_coarse_to_fine_rollout_base
    checkpoint: *dense_tworoom_checkpoint
    schedule: "MPC=- | CEM=coarse -> fine | Rollout=base | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: linear, start_level: coarsest, end_level: finest}
        rollout: {mode: fixed, level: base}

  - name: 11_mpc_fixed_cem_base_rollout_base_to_coarse
    role: tworoom_goal50_horizon5_11_mpc_fixed_cem_base_rollout_base_to_coarse
    checkpoint: *dense_tworoom_checkpoint
    schedule: "MPC=fixed | CEM=base | Rollout=base -> coarse | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: linear, start_level: base, end_level: coarsest}

  - name: 13_mpc_fixed_cem_coarse_to_base_rollout_fine_to_base
    role: tworoom_goal50_horizon5_13_mpc_fixed_cem_coarse_to_base_rollout_fine_to_base
    checkpoint: *dense_tworoom_checkpoint
    schedule: "MPC=fixed | CEM=coarse -> base | Rollout=fine -> base | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: linear, start_level: coarsest, end_level: base}
        rollout: {mode: linear, start_level: finest, end_level: base}

  - name: 18_mpc_coarse_to_fine_cem_base_rollout_base
    role: tworoom_goal50_horizon5_18_mpc_coarse_to_fine_cem_base_rollout_base
    checkpoint: *dense_tworoom_checkpoint
    schedule: "MPC=coarse -> fine | CEM=base | Rollout=base | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: linear, start_level: coarsest, end_level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: fixed, level: base}

  - name: 26_mpc_coarse_to_fine_cem_base_to_fine_rollout_base_to_coarse
    role: tworoom_goal50_horizon5_26_mpc_coarse_to_fine_cem_base_to_fine_rollout_base_to_coarse
    checkpoint: *dense_tworoom_checkpoint
    schedule: "MPC=coarse -> fine | CEM=base -> fine | Rollout=base -> coarse | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: linear, start_level: coarsest, end_level: finest}
        cem: {mode: linear, start_level: base, end_level: finest}
        rollout: {mode: linear, start_level: base, end_level: coarsest}
