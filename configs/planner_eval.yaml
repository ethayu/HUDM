experiment:
  name: "wm_ours+baseline"
  shared_plan:
    imports:
      - task/pusht_dataset.yaml
      - planner/default.yaml
    plan:
      artifacts:
        render: false
        save: false
  rollouts:
    seed: 0
    num_rollouts: 20
    sample_without_replacement: true
  execution:
    mode: "auto"
    max_workers: 2
  reporting:
    output_root: "rollouts"
  baseline: "wm_coarse_to_fine"
  variants:
    - name: "wm_coarse_to_fine"
      imports:
        - backend/wm_coarse_to_fine.yaml
        - fidelity/coarse_to_fine.yaml
    - name: "wm_256"
      imports:
        - backend/wm_256.yaml
        - fidelity/single.yaml
    - name: "wm_128"
      imports:
        - backend/wm_128.yaml
        - fidelity/single.yaml
    - name: "wm_64"
      imports:
        - backend/wm_64.yaml
        - fidelity/single.yaml
    - name: "wm_32"
      imports:
        - backend/wm_32.yaml
        - fidelity/single.yaml
    - name: "wm_16"
      imports:
        - backend/wm_16.yaml
        - fidelity/single.yaml

