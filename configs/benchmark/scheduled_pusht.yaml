output_dir: rollouts/mwm_scheduled_pusht
title: Scheduled MWM vs Upstream Le-WM on PushT
env_id: swm/PushT-v1
seed: 42
eval_config: configs/eval/paper_pusht.yaml
manifest:
  config: configs/manifest/pusht_paper_seed42.yaml
runs:
  - name: upstream
    role: upstream_lewm_converted
    checkpoint: checkpoints_mwm/upstream_lewm_pusht
  - name: scheduled
    role: mwm_scheduled
    checkpoint: checkpoints_mwm/mwm_scheduled_pusht
    planner:
      scheduler:
        policy: linear_cem
        start_level: coarsest
        end_level: finest
        rollout_level:
          mode: fixed
          level: base
