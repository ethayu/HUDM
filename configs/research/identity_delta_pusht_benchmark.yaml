output_dir: reports/research/identity_delta/seed_sweep/pusht_seed42
title: Identity Delta Seed Sweep on PushT
env_id: swm/PushT-v1
seed: 42
eval_config: configs/research/identity_delta_pusht_eval.yaml
manifest:
  group: identity_delta_pusht
  dir: reports/research/identity_delta/seed_sweep/manifests
runs:
  - name: upstream
    role: upstream_lewm_converted
    checkpoint: ${oc.env:MWM_ARTIFACT_ROOT}/checkpoints_mwm/upstream_lewm_pusht
    eval:
      episodes: 50
      num_envs: 50
  - name: retrained_identity
    role: retrained_lewm_identity
    checkpoint: ${oc.env:MWM_ARTIFACT_ROOT}/checkpoints_mwm/retrained_lewm_identity_pusht_upstream
    eval:
      episodes: 50
      num_envs: 50
