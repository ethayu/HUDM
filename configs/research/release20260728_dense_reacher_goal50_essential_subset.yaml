# Essential 7-run subset of the full goal50 sweep.
# Same output_dir as the full config so a later --resume run skips these completed cells.
output_dir: reports/research/release20260728_dense_reacher_goal50_plan100_execute20_all_fidelity_schedules
title: Release 2026-07-28 Dense Reacher Goal50 Essential Subset
env_id: swm/ReacherDMControl-v0
seed: 42
eval_config: configs/eval/paper_reacher.yaml
manifest:
  config: configs/manifest/reacher_paper_seed42_goal50_exact.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 50
    goal_indexing: exact
    budget: 100
  planner:
    flop_accounting: dynamics_audit
    horizon: 4
    receding_horizon: 4
    action_block: 5
sweep:
  planner.pop_size: [20, 50, 100, 150, 200]
  planner.elite_frac: [0.1]
  planner.n_iter: [5, 10, 15, 20, 30]

sweep_exclude:
  - planner.pop_size: 20
    planner.elite_frac: 0.05

runs:
  - name: 27_all_fixed_finest
    role: release20260728_goal50_plan100_execute20_dense_schedule_27_all_fixed_finest
    checkpoint: checkpoints_mwm/mwm_paper10_reacher_k192_release20260728
    schedule: "MPC=fixed finest | CEM=fixed finest | Rollout=fixed finest"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: finest}
        rollout: {mode: fixed, level: finest}

  - name: 01_rollout_fixed
    role: release20260728_goal50_plan100_execute20_dense_schedule_01_rollout_fixed
    checkpoint: &dense_reacher_checkpoint checkpoints_mwm/mwm_paper10_reacher_k96_120_144_168_192_release20260728
    schedule: "MPC=- | CEM=- | Rollout=fixed"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: fixed, level: base}

  - name: 15_mpc_fixed_cem_base_to_fine_rollout_base
    role: release20260728_goal50_plan100_execute20_dense_schedule_15_mpc_fixed_cem_base_to_fine_rollout_base
    checkpoint: *dense_reacher_checkpoint
    schedule: "MPC=fixed | CEM=base -> fine | Rollout=base"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: linear, start_level: base, end_level: finest}
        rollout: {mode: fixed, level: base}

  - name: 05_cem_fixed_rollout_base_to_coarse
    role: release20260728_goal50_plan100_execute20_dense_schedule_05_cem_fixed_rollout_base_to_coarse
    checkpoint: *dense_reacher_checkpoint
    schedule: "MPC=- | CEM=fixed | Rollout=base -> coarse"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: linear, start_level: base, end_level: coarsest}

  - name: 06_cem_coarse_to_fine_rollout_base
    role: release20260728_goal50_plan100_execute20_dense_schedule_06_cem_coarse_to_fine_rollout_base
    checkpoint: *dense_reacher_checkpoint
    schedule: "MPC=- | CEM=coarse -> fine | Rollout=base"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: linear, start_level: coarsest, end_level: finest}
        rollout: {mode: fixed, level: base}

  - name: 18_mpc_coarse_to_fine_cem_base_rollout_base
    role: release20260728_goal50_plan100_execute20_dense_schedule_18_mpc_coarse_to_fine_cem_base_rollout_base
    checkpoint: *dense_reacher_checkpoint
    schedule: "MPC=coarse -> fine | CEM=base | Rollout=base"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: linear, start_level: coarsest, end_level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: fixed, level: base}

  - name: 21_mpc_coarse_to_fine_cem_coarse_to_base_rollout_base
    role: release20260728_goal50_plan100_execute20_dense_schedule_21_mpc_coarse_to_fine_cem_coarse_to_base_rollout_base
    checkpoint: *dense_reacher_checkpoint
    schedule: "MPC=coarse -> fine | CEM=coarse -> base | Rollout=base"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: linear, start_level: coarsest, end_level: finest}
        cem: {mode: linear, start_level: coarsest, end_level: base}
        rollout: {mode: fixed, level: base}
