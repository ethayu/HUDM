experiment:
  name: "particle_many_rollouts"
  shared_plan:
    imports:
      - task/pusht_dataset.yaml
      - planner/default.yaml
    plan:
      artifacts:
        render: false
        save: false
  rollouts:
    seed: 0
    num_rollouts: 6
    sample_without_replacement: true
  execution:
    mode: "auto"
    max_workers: 6
  reporting:
    output_root: "rollouts"
  variants:
    - name: "particle_finest"
      imports:
        - backend/particle_state.yaml
        - fidelity/finest.yaml
    - name: "particle_coarse_to_fine"
      imports:
        - backend/particle_state.yaml
        - fidelity/coarse_to_fine.yaml
    - name: "particle_coarsest"
      imports:
        - backend/particle_state.yaml
        - fidelity/coarsest.yaml
