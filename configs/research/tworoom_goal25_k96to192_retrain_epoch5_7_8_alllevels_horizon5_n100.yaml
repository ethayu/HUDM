# CPU-parallel half of the remaining epochs to complete the full 10-epoch x
# 5-level sweep for mwm_paper10_tworoom_k96_120_144_168_192_sepopt_retrain_20260916.
# Covers epochs 5,7,8; the GPU0 file covers epochs 0,1,2,4. epoch3/6/9
# already covered elsewhere. Same protocol: horizon=5/receding_horizon=5,
# pop=300/elite_frac=0.1/n_iter=10, goal_offset=25, 100 episodes.
output_dir: reports/research/tworoom_goal25_k96to192_retrain_epoch5_7_8_alllevels_horizon5_n100
title: TwoRoom Goal25 -- mwm_paper10_tworoom_k96_120_144_168_192_sepopt_retrain_20260916, epochs 5/7/8, All Levels, Horizon5, N=100
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/release20260728_tworoom_goal25_exact_seed42.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 25
    goal_indexing: exact
    budget: 50
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5
    pop_size: 300
    elite_frac: 0.1
    n_iter: 10

