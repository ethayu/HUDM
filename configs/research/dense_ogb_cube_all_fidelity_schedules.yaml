# Run 00 is the converted upstream OGB Cube baseline. The source TSV contains 26
# schedule rows (rather than 25), kept below in source order. A dash means that
# the conceptual outer axis is not varied; the runtime representation still
# supplies the required fixed stage.
output_dir: reports/research/dense_ogb_cube_all_fidelity_schedules
title: Dense OGB Cube All-Axis Fidelity Schedule Matrix
env_id: swm/OGBCube-v0
seed: 42
eval_config: configs/eval/paper_ogb_cube.yaml
manifest:
  config: configs/manifest/ogb_cube_paper_seed42.yaml

# Every base run below is evaluated for the full Cartesian product (8 cells).
# The audited dynamics FLOP count is the default cost axis in the Pareto view.
run_defaults:
  planner:
    flop_accounting: dynamics_audit
sweep:
  planner.pop_size: [100, 300]
  planner.elite_frac: [0.05, 0.1]
  planner.n_iter: [5, 10]

runs:
  - name: 00_upstream_fixed_finest
    role: upstream_lewm_converted
    checkpoint: checkpoints_mwm/upstream_lewm_ogb_cube
    schedule: "upstream fixed finest"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: finest}
        rollout: {mode: fixed, level: finest}

  - name: 01_rollout_fixed
    role: dense_schedule_01_rollout_fixed
    checkpoint: &dense_ogb_cube_checkpoint checkpoints_mwm/mwm_dense_ogb_cube
    schedule: "MPC=- | CEM=- | Rollout=fixed"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: fixed, level: base}

  - name: 02_rollout_fine_to_coarse
    role: dense_schedule_02_rollout_fine_to_coarse
    checkpoint: *dense_ogb_cube_checkpoint
    schedule: "MPC=- | CEM=- | Rollout=fine -> coarse"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: linear, start_level: finest, end_level: coarsest}

  - name: 03_cem_fixed_rollout_base
    role: dense_schedule_03_cem_fixed_rollout_base
