seed: 3072
env_id: swm/ReacherDMControl-v0
base:
  family: lewm
  checkpoint: models--quentinll--lewm-reacher
mwm:
  component_policy:
    shared: [latent_producer]
    per_level: [transition]
    reconstructor: [decoder]
  loss_terms:
    regularizers: shared_latent
    reconstructor_detach_encoder: true
    reconstructor_contributes_to_encoder_loss: false
data:
  path: data/upstream/reacher.lance
  format: lance
  split_ratio: 0.9
  pixels_key: pixels
  action_key: action
  frameskip: 5
  keys_to_load: [pixels, action, qpos, qvel, observation]
  keys_to_cache: [action, qpos, qvel, observation]
restore:
  import_path: mwm.swm.restore.reacher_qpos_match_restore_spec
model:
  D: 192
  K: [96, 120, 144, 168, 192]
  action_dim: auto
  image_shape: auto
  action_block: 5
  history_size: 3
  num_preds: 1
train:
  batch_size: 128
  horizon: 4
  num_workers: 6
  drop_last: true
  prefetch_factor: 3
  pin_memory: true
  precision: bf16
  no_cuda: false
  checkpoint_dir: checkpoints_mwm
  run_name: mwm_dense_reacher_spt_isolateddec_h10_seed3072_20260809
  backend: stable_worldmodel_lewm
  timestamp_run_dir: false
  clean_trainer_root: true
  resume_checkpoint: null
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  checkpoint_every_n_train_steps: 1000
  gradient_clip_val: 1.0
  matmul_precision: high
  slurm_auto_requeue: false
optim:
  lr: 0.00005
  weight_decay: 0.001
decoder_training:
  enabled: true
  mode: separate_optimizer
  gradient_clip_val: 1.0
  lr: 0.00005
  weight_decay: 0.001
loss:
  rollout_weight: 1.0
  sigreg_weight: 0.10
  sigreg_knots: 17
  sigreg_num_proj: 1024
  history_size: 3
  num_preds: 1
schedule:
  max_epochs: 10
  lr_max_epochs: 10
