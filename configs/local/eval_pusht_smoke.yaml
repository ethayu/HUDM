checkpoint:
  run_dir: checkpoints_mwm/upstream_lewm_pusht
  epoch: null
env_id: swm/PushT-v1
data:
  path: data/upstream/pusht_expert_train.lance
  format: lance
  split_ratio: 0.9
  pixels_key: pixels
  action_key: action
  keys_to_cache: [action, proprio, state]
  action_preprocessing: standard_scaler
eval:
  episodes: 2
  goal_offset: 25
  seed: 42
  budget: 8
  num_envs: 1
  output_path: rollouts/local_pusht_smoke/eval.json
  manifest_path: null
  sampling: stable_worldmodel
  write_manifest_path: rollouts/manifests/local_pusht_smoke.json
  save_video: false
  video_path: rollouts/local_pusht_smoke/videos
env:
  max_episode_steps: 100
  goal_conditioned: true
  kwargs: {}
restore:
  import_path: null
planner:
  horizon: 5
  receding_horizon: 5
  action_block: 5
  batch_size: 1
  pop_size: 16
  topk: 4
  elite_frac: 0.25
  n_iter: 2
  init_std: 1.0
  seed: 42
  warm_start: true
  clamp_actions: false
  std_unbiased: true
  scheduler:
    policy: fixed
    level: finest
    rollout_level:
      mode: fixed
      level: base
device: cpu
