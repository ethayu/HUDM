checkpoint:
  run_dir: ${oc.env:MWM_ARTIFACT_ROOT}/checkpoints_mwm/upstream_lewm_tworoom
  epoch: null
env_id: swm/TwoRoom-v1
data:
  path: ${oc.env:MWM_ARTIFACT_ROOT}/data/upstream/tworoom.lance
  format: lance
  split_ratio: 0.9
  pixels_key: pixels
  action_key: action
  keys_to_cache: [action, proprio]
  action_preprocessing: standard_scaler
eval:
  episodes: 50
  goal_offset: 25
  seed: 42
  budget: 50
  num_envs: 50
  output_path: reports/research/identity_delta/seed_sweep/tworoom/eval.json
  manifest_path: null
  sampling: stable_worldmodel
  write_manifest_path: reports/research/identity_delta/seed_sweep/manifests/tworoom_seed42.json
  save_video: false
  video_path: reports/research/identity_delta/seed_sweep/tworoom/videos
env:
  max_episode_steps: 100
  goal_conditioned: true
  kwargs: {}
restore:
  import_path: null
planner:
  horizon: 5
  receding_horizon: 5
  action_block: 5
  batch_size: 1
  pop_size: 300
  topk: 30
  elite_frac: 0.1
  n_iter: 30
  init_std: 1.0
  warm_start: true
  clamp_actions: false
  std_unbiased: true
  seed: 42
  scheduler:
    enabled: true
    mpc:
      mode: fixed
      level: finest
    cem:
      mode: fixed
      level: base
    rollout:
      mode: fixed
      level: base
device: auto
