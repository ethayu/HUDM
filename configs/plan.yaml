plan:
  env_id: "pusht"
  zarr_path: "synthetic/pusht_synth_small.zarr"
  split_ratio: 0.8
  # ---------------- Environment -----------------
  env:
    with_velocity: true
    with_target:   true
    add_noise:     0            # 0=no noise, 1=action, 2=state
    noise_std:     [0.5, 0.5]   # per-dim σ 

  # ---------------- Planner ---------------------
  planning_horizon: 5
  sample_horizon: 5
  steps:          5
  pop_size:      100
  elite_frac:    0.3
  n_iter:         10
  n_env_samples:  4
  var_threshold:  0.5

  # How many of the first CEM-planned actions to execute before re-planning.
  # Setting this >1 moves the planner towards a more open-loop behaviour.
  replan_every:   20

  render:         true
  save:           true