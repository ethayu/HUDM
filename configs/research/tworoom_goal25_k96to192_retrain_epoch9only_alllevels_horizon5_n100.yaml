# CPU-parallel split of the epoch9 cells from
# tworoom_goal25_k96to192_retrain_epoch3_6_9_alllevels_horizon5_n100.yaml
# (which is running epoch3/6/9 sequentially on GPU0). Separate output_dir to
# avoid any collision with that job's directory indices. Same protocol:
# horizon=5/receding_horizon=5, pop=300/elite_frac=0.1/n_iter=10,
# goal_offset=25, 100 episodes.
output_dir: reports/research/tworoom_goal25_k96to192_retrain_epoch9only_alllevels_horizon5_n100
title: TwoRoom Goal25 -- mwm_paper10_tworoom_k96_120_144_168_192_sepopt_retrain_20260916, epoch 9, All Levels, Horizon5, N=100
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/release20260728_tworoom_goal25_exact_seed42.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 25
    goal_indexing: exact
    budget: 50
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5
    pop_size: 300
    elite_frac: 0.1
    n_iter: 10

runs:
  - name: k96to192_retrain_ep09_k96
    role: tworoom_goal25_k96to192_retrain_ep09_k96_horizon5_n100
    checkpoint: &ep09 checkpoints_dense_k96to192_sepopt_retrain_20260916/checkpoints_mwm/mwm_paper10_tworoom_k96_120_144_168_192_sepopt_retrain_20260916_epoch_exports/epoch_009
    schedule: "epoch_009 (K=[96,120,144,168,192]) | fixed at K=96 (level 0) | horizon=5, n=100"
    planner: {scheduler: {enabled: true, mpc: {mode: fixed, level: 0}, cem: {mode: fixed, level: 0}, rollout: {mode: fixed, level: 0}}}

  - name: k96to192_retrain_ep09_k120
    role: tworoom_goal25_k96to192_retrain_ep09_k120_horizon5_n100
    checkpoint: *ep09
    schedule: "epoch_009 (K=[96,120,144,168,192]) | fixed at K=120 (level 1) | horizon=5, n=100"
    planner: {scheduler: {enabled: true, mpc: {mode: fixed, level: 1}, cem: {mode: fixed, level: 1}, rollout: {mode: fixed, level: 1}}}

  - name: k96to192_retrain_ep09_k144
    role: tworoom_goal25_k96to192_retrain_ep09_k144_horizon5_n100
    checkpoint: *ep09
    schedule: "epoch_009 (K=[96,120,144,168,192]) | fixed at K=144 (level 2) | horizon=5, n=100"
    planner: {scheduler: {enabled: true, mpc: {mode: fixed, level: 2}, cem: {mode: fixed, level: 2}, rollout: {mode: fixed, level: 2}}}

  - name: k96to192_retrain_ep09_k168
    role: tworoom_goal25_k96to192_retrain_ep09_k168_horizon5_n100
    checkpoint: *ep09
    schedule: "epoch_009 (K=[96,120,144,168,192]) | fixed at K=168 (level 3) | horizon=5, n=100"
    planner: {scheduler: {enabled: true, mpc: {mode: fixed, level: 3}, cem: {mode: fixed, level: 3}, rollout: {mode: fixed, level: 3}}}

  - name: k96to192_retrain_ep09_k192
    role: tworoom_goal25_k96to192_retrain_ep09_k192_horizon5_n100
    checkpoint: *ep09
