seed: 42
env_id: swm/PushT-v1
base:
  family: lewm
  checkpoint: models--quentinll--lewm-pusht
mwm:
  component_policy:
    shared: [latent_producer]
    per_level: [transition]
    reconstructor: []
  loss_terms:
    regularizers: shared_latent
    reconstructor_detach_encoder: true
    reconstructor_contributes_to_encoder_loss: false
data:
  path: data/pusht_swm.lance
  format: lance
  split_ratio: 0.9
  pixels_key: pixels
  action_key: action
  frameskip: 5
  keys_to_load: [pixels, action, proprio, state]
  keys_to_cache: [action, proprio, state]
model:
  D: 192
  K: [48, 96, 144, 192]
  action_dim: auto
  action_block: 5
  image_shape: auto
  history_size: 3
  num_preds: 1
train:
  batch_size: 128
  horizon: 4
  num_workers: 6
  drop_last: true
  prefetch_factor: 3
  pin_memory: false
  precision: bf16
  no_cuda: false
  checkpoint_dir: checkpoints_mwm
  run_name: mwm_scheduled_pusht
  backend: stable_worldmodel_lewm
  timestamp_run_dir: false
  clean_trainer_root: true
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  checkpoint_every_n_train_steps: 1000
  gradient_clip_val: 1.0
  matmul_precision: high
  slurm_auto_requeue: false
optim:
  lr: 0.00005
  weight_decay: 0.001
loss:
  rollout_weight: 1.0
  recon_weight: 0.0
  sigreg_weight: 0.09
  sigreg_knots: 17
  sigreg_num_proj: 1024
  history_size: 3
  num_preds: 1
schedule:
  max_epochs: 10
  patience: 10
  min_delta: 0.0
