    checkpoint: *k12to96_checkpoint
    schedule: "mwm_paper10_tworoom_k12to96_sepopt_20260915 (K=[12,24,36,48,60,72,84,96]) | MPC/CEM/Rollout all fixed at K=48 (level 3) | horizon=5, n=200"
