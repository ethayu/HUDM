experiment:
  name: "smoke_gt_env"
  shared_plan:
    imports:
      - task/pusht_smoke_dataset.yaml
      - planner/smoke.yaml
    plan:
      artifacts:
        render: false
        save: false
  rollouts:
    seed: 3
    num_rollouts: 2
    sample_without_replacement: true
  execution:
    mode: "process"
    max_workers: 2
  reporting:
    output_root: "rollouts"
  baseline: "finest_fixed"
  variants:
    - name: "finest_fixed"
      imports:
        - backend/gt_env_state.yaml
        - fidelity/finest.yaml
    - name: "coarse_fixed"
      imports:
        - backend/gt_env_state.yaml
        - fidelity/coarsest.yaml
