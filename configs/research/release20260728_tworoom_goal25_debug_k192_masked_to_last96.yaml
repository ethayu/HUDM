# Mirror of release20260728_tworoom_goal25_debug_k192_masked_to_k96.yaml:
# same individually-trained K=192 TwoRoom checkpoint, but this time zero out
# dims [0:96] and keep ONLY dims [96:192] (the "extra" dims beyond a K=96
# prefix), to test whether task-relevant information is concentrated in the
# first 96 dims specifically, or spread more evenly across all 192.
#
# Must be run via debug_tworoom_k192_masked_to_last96.py, which monkeypatches
# LeWMMatryoshkaWorldModel._encode_pixels to zero dims [0:96] right after
# encoding (keeping the tensor at its native 192-dim shape).
#
# Same eval protocol as release20260728_tworoom_goal25_k_matched_comparison.yaml
# for direct comparability against:
#   - individual_k96 (dedicated K=96 training): 32%
#   - dense_matched_k96 (matryoshka K=96 slice): 97%
#   - individual_k192, dims[96:] zeroed (first-96-kept variant): 70%
#   - individual_k192, full (unmasked): 84%
output_dir: reports/research/release20260728_tworoom_goal25_debug_k192_masked_to_last96
title: Release 2026-07-28 TwoRoom Goal25 Debug -- Individual K192 Checkpoint, Last 96 Dims Only (first 96 zeroed)
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/release20260728_tworoom_goal25_exact_seed42.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 25
    goal_indexing: exact
    budget: 50
  planner:
    flop_accounting: dynamics_audit
    horizon: 2
    receding_horizon: 2
    action_block: 5
    pop_size: 300
    elite_frac: 0.1
    n_iter: 10

runs:
  - name: k192_checkpoint_masked_to_last96dims
    role: tworoom_goal25_k192_checkpoint_masked_to_last96dims
    checkpoint: checkpoints_mwm/mwm_paper10_tworoom_k192_release20260728
    schedule: "individually-trained K=192 checkpoint | dims [0:96] zeroed at encode time (only [96:192] kept) | MPC/CEM/Rollout all fixed at the only declared level"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 0}
        cem: {mode: fixed, level: 0}
        rollout: {mode: fixed, level: 0}
