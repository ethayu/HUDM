experiment:
  name: "smoke_gt_env"
  shared_plan:
    imports:
      - task/pusht_dataset.yaml
      - planner/default.yaml
    plan:
      artifacts:
        render: false
        save: false
  rollouts:
    seed: 0
    num_rollouts: 20
    sample_without_replacement: true
  execution:
    mode: "auto"
    max_workers: 2
  reporting:
    output_root: "rollouts"
  baseline: "finest_fixed"
  variants:
    - name: "finest_fixed"
      imports:
        - backend/gt_env_image.yaml
        - fidelity/finest.yaml
    # - name: "coarse_fixed"
    #   imports:
    #     - backend/gt_env_state.yaml
    #     - fidelity/coarsest.yaml
