checkpoint:
  run_dir: checkpoints_mwm/upstream_lewm_tworoom
  epoch: null
env_id: swm/TwoRoom-v1
data:
  # Stable-WM's current default data path is Lance. This matches the upstream
  # Le-WM training/eval representation used by the paper-parity check.
  path: data/upstream/tworoom.lance
  format: lance
  split_ratio: 0.9
  pixels_key: pixels
  action_key: action
  keys_to_cache: [action, proprio]
  action_preprocessing: standard_scaler
eval:
  episodes: 50
  goal_offset: 25
  goal_indexing: upstream_lewm_end_exclusive
  seed: 42
  budget: 50
  num_envs: 50
  output_path: rollouts/mwm_paper_parity/tworoom_upstream/eval.json
  manifest_path: null
  sampling: upstream_lewm
  write_manifest_path: rollouts/mwm_paper_parity/tworoom_seed42_manifest.json
  save_video: false
  video_path: rollouts/mwm_paper_parity/tworoom_videos
env:
  max_episode_steps: 100
  goal_conditioned: true
  kwargs: {}
restore:
  import_path: null
planner:
  # Reproduce initial LeWM jepa.py's growing-prefix action embedding order.
  rollout_semantics: upstream_lewm_historical
  policy_semantics: upstream_lewm_historical
  horizon: 5
  receding_horizon: 5
  action_block: 5
  batch_size: 1
  pop_size: 300
  topk: 30
  elite_frac: 0.1
  # Paper Appendix D: 30 CEM iterations for PushT, 10 for every other env.
  n_iter: 10
  init_std: 1.0
  seed: 42
  warm_start: true
  clamp_actions: false
  std_unbiased: true
  scheduler:
    enabled: true
    mpc:
      mode: fixed
      level: finest
    cem:
      mode: fixed
      level: base
    rollout:
      mode: fixed
      level: base
device: auto
