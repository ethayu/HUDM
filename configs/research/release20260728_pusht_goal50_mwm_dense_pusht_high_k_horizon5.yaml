# PushT counterpart of the tworoom/ogb_cube/reacher mwm_dense high-K comparison,
# goal_offset=50. Completes the full 6-level curve for
# checkpoints_mwm/mwm_dense_pusht: K=96/144/192 (levels 3/4/5).
# Same CEM protocol as PushT's existing k_matched_comparison_horizon5 config
# (n_iter=30, unlike the other envs' n_iter=10) so the curves stay comparable.
output_dir: reports/research/release20260728_pusht_goal50_mwm_dense_pusht_high_k_horizon5
title: Release 2026-07-28 PushT Goal50 -- mwm_dense_pusht High-K (96/144/192), Horizon5, N=100
env_id: swm/PushT-v1
seed: 42
eval_config: configs/eval/paper_pusht.yaml
manifest:
  config: configs/manifest/pusht_paper_seed42_goal50_exact.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 50
    goal_indexing: exact
    budget: 100
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5
    pop_size: 300
    elite_frac: 0.1
    n_iter: 30

runs:
  - name: mwm_dense_pusht_k96
    role: pusht_goal50_mwm_dense_pusht_k96_horizon5
    checkpoint: &mwm_dense_pusht_checkpoint checkpoints_mwm/mwm_dense_pusht
    schedule: "mwm_dense_pusht checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=96 (level 3) | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 3}
        cem: {mode: fixed, level: 3}
        rollout: {mode: fixed, level: 3}

  - name: mwm_dense_pusht_k144
    role: pusht_goal50_mwm_dense_pusht_k144_horizon5
    checkpoint: *mwm_dense_pusht_checkpoint
    schedule: "mwm_dense_pusht checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=144 (level 4) | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 4}
        cem: {mode: fixed, level: 4}
        rollout: {mode: fixed, level: 4}

  - name: mwm_dense_pusht_k192
    role: pusht_goal50_mwm_dense_pusht_k192_horizon5
    checkpoint: *mwm_dense_pusht_checkpoint
    schedule: "mwm_dense_pusht checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=192 (level 5) | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 5}
        cem: {mode: fixed, level: 5}
        rollout: {mode: fixed, level: 5}
