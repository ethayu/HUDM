checkpoint:
  run_dir: ${oc.env:MWM_ARTIFACT_ROOT}/checkpoints_mwm/upstream_lewm_reacher
  epoch: null
env_id: swm/ReacherDMControl-v0
data:
  path: ${oc.env:MWM_ARTIFACT_ROOT}/data/upstream/reacher.lance
  format: lance
  split_ratio: 0.9
  pixels_key: pixels
  action_key: action
  keys_to_load: [pixels, action, qpos, qvel, observation]
  keys_to_cache: [action, qpos, qvel, observation]
  action_preprocessing: standard_scaler
eval:
  episodes: 200
  goal_offset: 25
  seed: 42
  budget: 50
  num_envs: 50
  output_path: reports/research/reacher_identity_delta/seed_sweep/reacher/eval.json
  manifest_path: null
  sampling: stable_worldmodel
  write_manifest_path: reports/research/reacher_identity_delta/seed_sweep/manifests/reacher_seed42.json
  save_video: false
  video_path: reports/research/reacher_identity_delta/seed_sweep/reacher/videos
env:
  max_episode_steps: 100
  goal_conditioned: true
  kwargs:
    task: qpos_match
restore:
  import_path: mwm.swm.restore.reacher_qpos_match_restore_spec
planner:
  horizon: 5
  receding_horizon: 5
  action_block: 5
  batch_size: 1
  pop_size: 300
  topk: 30
  elite_frac: 0.1
  n_iter: 30
  init_std: 1.0
  seed: 42
  warm_start: true
  clamp_actions: false
  std_unbiased: true
  scheduler:
    policy: fixed
    level: finest
    rollout_level:
      mode: fixed
      level: base
device: auto
