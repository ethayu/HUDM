plan:
  env_id: "pusht"
  # ---------------- Environment -----------------
  env:
    with_velocity: true
    with_target:   true
    add_noise:     0            # 0=no noise, 1=action, 2=state
    noise_std:     [0.5, 0.5]   # per-dim σ 

  # ---------------- Planner ---------------------
  horizon:        50
  steps:          20
  pop_size:      10
  elite_frac:    0.3
  n_iter:         10
  n_env_samples:  4
  var_threshold:  0.5

  render:         true
  save:           true