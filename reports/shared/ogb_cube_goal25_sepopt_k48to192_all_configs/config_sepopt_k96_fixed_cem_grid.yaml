# K=96 counterpart of release20260728_ogb_cube_goal25_sepopt_k192_fixed_cem_grid.yaml.
# Fixed K=96 (level 2, not the finest) on the sepopt K48-192 checkpoint, no
# scheduling -- directly comparable to release20260728_ogb_cube_goal25_densek96_fixed_cem_grid.yaml
# (the *original* paper10 dense checkpoint fixed at K=96), to isolate
# "does the sepopt retraining itself change K=96 performance, independent of
# adaptive scheduling?" Same 22-cell CEM grid, same 100-pair manifest/episodes
# as release20260728_dense_ogb_cube_all_fidelity_schedules.yaml.
output_dir: reports/research/release20260728_ogb_cube_goal25_sepopt_k96_fixed_cem_grid
title: Release 2026-07-28 OGB Cube Goal25 -- Fixed K=96 (Sepopt K48-192 Checkpoint) CEM Grid
env_id: swm/OGBCube-v0
seed: 42
eval_config: configs/eval/paper_ogb_cube.yaml
manifest:
  config: configs/manifest/release20260728_ogb_cube_goal25_exact_seed42_n100.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 25
    goal_indexing: exact
    budget: 50
  planner:
    flop_accounting: dynamics_audit
    horizon: 2
    receding_horizon: 2
    action_block: 5

sweep:
  planner.pop_size: [20, 50, 100, 150, 200]
  planner.elite_frac: [0.1]
  planner.n_iter: [5, 10, 15, 20, 30]
sweep_exclude:
  - planner.pop_size: 20
    planner.elite_frac: 0.05
  - planner.pop_size: 200
    planner.n_iter: 30
  - planner.pop_size: 150
    planner.n_iter: 30
  - planner.pop_size: 200
    planner.n_iter: 20

runs:
  - name: sepopt_k96_fixed
    role: ogb_cube_goal25_sepopt_k96_fixed
    checkpoint: checkpoints_dense_k48to192_sepopt_20260917_ogb_cube/checkpoints_mwm/mwm_paper10_ogb_cube_k48_72_96_120_144_168_192_sepopt_actckpt_20260917
    schedule: "sepopt K=[48,72,96,120,144,168,192] checkpoint | MPC/CEM/Rollout all fixed at K=96 (level 2), no transitions"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 2}
        cem: {mode: fixed, level: 2}
        rollout: {mode: fixed, level: 2}
