# The source TSV contains 26 schedule rows (rather than 25). This matrix keeps
# every row in source order. A dash means that the conceptual outer axis is not
# varied; the runtime representation still supplies the required fixed stage.
output_dir: reports/research/dense_pusht_all_fidelity_schedules
title: Dense PushT All-Axis Fidelity Schedule Matrix
env_id: swm/PushT-v1
seed: 42
eval_config: configs/eval/paper_pusht.yaml
manifest:
  config: configs/manifest/pusht_paper_seed42.yaml

runs:
  - name: 01_rollout_fixed
    role: dense_schedule_01_rollout_fixed
    checkpoint: &dense_pusht_checkpoint checkpoints_mwm/mwm_dense_pusht
    schedule: "MPC=- | CEM=- | Rollout=fixed"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: fixed, level: base}

  - name: 02_rollout_fine_to_coarse
    role: dense_schedule_02_rollout_fine_to_coarse
    checkpoint: *dense_pusht_checkpoint
    schedule: "MPC=- | CEM=- | Rollout=fine -> coarse"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: finest}
        cem: {mode: fixed, level: base}
        rollout: {mode: linear, start_level: finest, end_level: coarsest}

  - name: 03_cem_fixed_rollout_base
