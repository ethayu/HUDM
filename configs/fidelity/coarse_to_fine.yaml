plan:
  planner:
    fidelity:
      enabled: true
      num_levels: 4
      mpc:
        mode: "linear"
        start_level: "coarsest"
        end_level: "finest"
      cem:
        mode: "linear"
        start_level: "base"
        end_level: "finest"
      rollout:
        mode: "fixed"
        level: "base"
        uncertainty:
          criterion: "mean"
          threshold: 0.05
          percentile: 0.8
          min_level: "coarsest"
          max_downshifts_per_step: 1
