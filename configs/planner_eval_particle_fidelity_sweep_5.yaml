experiment:
  name: "particle_fidelity_sweep_5"
  shared_plan:
    imports:
      - task/pusht_dataset.yaml
      - planner/default.yaml
      - backend/particle_state.yaml
    plan:
      budget:
        max_env_steps: 15
      planner:
        horizon: 6
        replan_every: 5
        cem:
          pop_size: 32
          elite_frac: 0.25
          n_iter: 6
          init_std: 0.75
          warm_start: true
          action_low: null
          action_high: null
      artifacts:
        render: false
        save: false
  rollouts:
    seed: 0
    num_rollouts: 5
    sample_without_replacement: true
  execution:
    mode: "auto"
    max_workers: 6
  reporting:
    output_root: "rollouts"
  baseline: "particle_l7_n252_fixed"
  variants:
    - name: "particle_l0_n1_fixed"
      overrides:
        planner:
          fidelity:
            enabled: true
            mpc:
              mode: "fixed"
              level: 0
            cem:
              mode: "fixed"
              level: "base"
            rollout:
              mode: "fixed"
              level: "base"
    - name: "particle_l1_n2_fixed"
      overrides:
        planner:
          fidelity:
            enabled: true
            mpc:
              mode: "fixed"
              level: 1
            cem:
              mode: "fixed"
              level: "base"
            rollout:
              mode: "fixed"
              level: "base"
    - name: "particle_l2_n3_fixed"
      overrides:
        planner:
          fidelity:
            enabled: true
            mpc:
              mode: "fixed"
              level: 2
            cem:
              mode: "fixed"
              level: "base"
            rollout:
              mode: "fixed"
              level: "base"
    - name: "particle_l3_n4_fixed"
      overrides:
        planner:
          fidelity:
            enabled: true
            mpc:
              mode: "fixed"
              level: 3
            cem:
              mode: "fixed"
              level: "base"
            rollout:
              mode: "fixed"
              level: "base"
    - name: "particle_l4_n16_fixed"
      overrides:
        planner:
          fidelity:
            enabled: true
            mpc:
              mode: "fixed"
              level: 4
            cem:
              mode: "fixed"
              level: "base"
            rollout:
              mode: "fixed"
              level: "base"
    - name: "particle_l5_n64_fixed"
