# Quick single-level check: K=144 only, from the in-progress
# mwm_dense_tworoom_k48to192 run (K=[48,72,96,120,144,192]), exported
# mid-training from last.ckpt at epoch 2/10. Same fixed eval protocol as
# tworoom_goal25_k48to144_epoch2check_k144only_horizon5_n200 (episodes=100
# manifest) so the two runs' K=144 levels are directly comparable:
# horizon=5/receding_horizon=5, pop=300/elite_frac=0.1/n_iter=10,
# goal_offset=25, 100 episodes.
output_dir: reports/research/tworoom_goal25_k48to192_epoch2check_k144only_horizon5_n100
title: TwoRoom Goal25 -- mwm_dense_tworoom_k48to192 (epoch2 in-progress) K=144 only, Horizon5, N=100
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/release20260728_tworoom_goal25_exact_seed42.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 25
    goal_indexing: exact
    budget: 50
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5
    pop_size: 300
    elite_frac: 0.1
    n_iter: 10

runs:
  - name: mwm_k48to192_epoch2check_k144
    role: tworoom_goal25_k48to192_epoch2check_k144_horizon5_n100
    checkpoint: checkpoints_mwm/mwm_dense_tworoom_k48to192_epoch2_check
    schedule: "mwm_dense_tworoom_k48to192 epoch2-in-progress (K=[48,72,96,120,144,192]) | MPC/CEM/Rollout all fixed at K=144 (level 4) | horizon=5, n=100"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 4}
        cem: {mode: fixed, level: 4}
        rollout: {mode: fixed, level: 4}
