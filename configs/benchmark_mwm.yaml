output_dir: rollouts/mwm_benchmark
title: MWM V1 Benchmark Gate
require_shared_manifests: true
gate:
  enabled: true
  env_ids: [swm/PushT-v1, swm/TwoRoom-v1]
  seeds: [0, 1, 2]
  roles: [upstream_lewm_converted, retrained_lewm_single, mwm_scheduled]
runs:
  - {name: pusht_seed0_upstream_lewm_converted, role: upstream_lewm_converted, manifest_group: pusht, config: configs/eval_mwm_lewm_pusht.yaml, overrides: {eval: {seed: 0}, checkpoint: {run_dir: checkpoints_mwm/upstream_lewm_pusht}}}
  - {name: pusht_seed0_retrained_lewm_single, role: retrained_lewm_single, manifest_group: pusht, config: configs/eval_mwm_lewm_pusht.yaml, overrides: {eval: {seed: 0}, checkpoint: {run_dir: checkpoints_mwm/retrained_lewm_single_pusht}}}
  - {name: pusht_seed0_mwm_scheduled, role: mwm_scheduled, manifest_group: pusht, config: configs/eval_mwm_lewm_pusht.yaml, overrides: {eval: {seed: 0}, checkpoint: {run_dir: checkpoints_mwm/mwm_scheduled_pusht}}}
  - {name: pusht_seed1_upstream_lewm_converted, role: upstream_lewm_converted, manifest_group: pusht, config: configs/eval_mwm_lewm_pusht.yaml, overrides: {eval: {seed: 1}, checkpoint: {run_dir: checkpoints_mwm/upstream_lewm_pusht}}}
  - {name: pusht_seed1_retrained_lewm_single, role: retrained_lewm_single, manifest_group: pusht, config: configs/eval_mwm_lewm_pusht.yaml, overrides: {eval: {seed: 1}, checkpoint: {run_dir: checkpoints_mwm/retrained_lewm_single_pusht}}}
  - {name: pusht_seed1_mwm_scheduled, role: mwm_scheduled, manifest_group: pusht, config: configs/eval_mwm_lewm_pusht.yaml, overrides: {eval: {seed: 1}, checkpoint: {run_dir: checkpoints_mwm/mwm_scheduled_pusht}}}
  - {name: pusht_seed2_upstream_lewm_converted, role: upstream_lewm_converted, manifest_group: pusht, config: configs/eval_mwm_lewm_pusht.yaml, overrides: {eval: {seed: 2}, checkpoint: {run_dir: checkpoints_mwm/upstream_lewm_pusht}}}
  - {name: pusht_seed2_retrained_lewm_single, role: retrained_lewm_single, manifest_group: pusht, config: configs/eval_mwm_lewm_pusht.yaml, overrides: {eval: {seed: 2}, checkpoint: {run_dir: checkpoints_mwm/retrained_lewm_single_pusht}}}
  - {name: pusht_seed2_mwm_scheduled, role: mwm_scheduled, manifest_group: pusht, config: configs/eval_mwm_lewm_pusht.yaml, overrides: {eval: {seed: 2}, checkpoint: {run_dir: checkpoints_mwm/mwm_scheduled_pusht}}}
  - {name: tworoom_seed0_upstream_lewm_converted, role: upstream_lewm_converted, manifest_group: tworoom, config: configs/eval_mwm_lewm_tworoom.yaml, overrides: {eval: {seed: 0}, checkpoint: {run_dir: checkpoints_mwm/upstream_lewm_tworoom}}}
  - {name: tworoom_seed0_retrained_lewm_single, role: retrained_lewm_single, manifest_group: tworoom, config: configs/eval_mwm_lewm_tworoom.yaml, overrides: {eval: {seed: 0}, checkpoint: {run_dir: checkpoints_mwm/retrained_lewm_single_tworoom}}}
  - {name: tworoom_seed0_mwm_scheduled, role: mwm_scheduled, manifest_group: tworoom, config: configs/eval_mwm_lewm_tworoom.yaml, overrides: {eval: {seed: 0}, checkpoint: {run_dir: checkpoints_mwm/mwm_scheduled_tworoom}}}
  - {name: tworoom_seed1_upstream_lewm_converted, role: upstream_lewm_converted, manifest_group: tworoom, config: configs/eval_mwm_lewm_tworoom.yaml, overrides: {eval: {seed: 1}, checkpoint: {run_dir: checkpoints_mwm/upstream_lewm_tworoom}}}
  - {name: tworoom_seed1_retrained_lewm_single, role: retrained_lewm_single, manifest_group: tworoom, config: configs/eval_mwm_lewm_tworoom.yaml, overrides: {eval: {seed: 1}, checkpoint: {run_dir: checkpoints_mwm/retrained_lewm_single_tworoom}}}
  - {name: tworoom_seed1_mwm_scheduled, role: mwm_scheduled, manifest_group: tworoom, config: configs/eval_mwm_lewm_tworoom.yaml, overrides: {eval: {seed: 1}, checkpoint: {run_dir: checkpoints_mwm/mwm_scheduled_tworoom}}}
  - {name: tworoom_seed2_upstream_lewm_converted, role: upstream_lewm_converted, manifest_group: tworoom, config: configs/eval_mwm_lewm_tworoom.yaml, overrides: {eval: {seed: 2}, checkpoint: {run_dir: checkpoints_mwm/upstream_lewm_tworoom}}}
  - {name: tworoom_seed2_retrained_lewm_single, role: retrained_lewm_single, manifest_group: tworoom, config: configs/eval_mwm_lewm_tworoom.yaml, overrides: {eval: {seed: 2}, checkpoint: {run_dir: checkpoints_mwm/retrained_lewm_single_tworoom}}}
  - {name: tworoom_seed2_mwm_scheduled, role: mwm_scheduled, manifest_group: tworoom, config: configs/eval_mwm_lewm_tworoom.yaml, overrides: {eval: {seed: 2}, checkpoint: {run_dir: checkpoints_mwm/mwm_scheduled_tworoom}}}
