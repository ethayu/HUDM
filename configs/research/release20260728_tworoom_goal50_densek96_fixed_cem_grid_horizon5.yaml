# Goal50 counterpart of release20260728_tworoom_goal25_densek96_fixed_cem_grid.yaml,
# at horizon=5/receding_horizon=5 (the existing goal50 all-fidelity sweep
# uses horizon=4; this deliberately goes one step further, matching the
# horizon=5 used throughout the goal25 fixed-K-vs-adaptive-schedule analysis).
#
# Same pop_size x n_iter grid (25 combos), fixed K=96 (dense checkpoint,
# level 0), no scheduling at all -- to compare against a representative
# adaptive-schedule sweep at the same goal50/horizon=5 settings
# (release20260728_tworoom_goal50_representative_schedules_horizon5.yaml).
output_dir: reports/research/release20260728_tworoom_goal50_densek96_fixed_cem_grid_horizon5
title: Release 2026-07-28 TwoRoom Goal50 -- Fixed K=96 (Dense Checkpoint) CEM Grid, Horizon5
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/tworoom_paper_seed42_goal50_exact.yaml

run_defaults:
  eval:
    episodes: 100
    num_envs: 50
    goal_offset: 50
    goal_indexing: exact
    budget: 100
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5

sweep:
  planner.pop_size: [20, 50, 100, 150, 200]
  planner.elite_frac: [0.1]
  planner.n_iter: [5, 10, 15, 20, 30]
sweep_exclude:
  - planner.pop_size: 20
    planner.elite_frac: 0.05

runs:
  - name: densek96_fixed
    role: tworoom_goal50_densek96_fixed_horizon5
    checkpoint: checkpoints_mwm/mwm_paper10_tworoom_k96_120_144_168_192_release20260728
    schedule: "dense K=[96,120,144,168,192] checkpoint | MPC/CEM/Rollout all fixed at K=96 (level 0), no transitions | horizon=5"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 0}
        cem: {mode: fixed, level: 0}
        rollout: {mode: fixed, level: 0}
