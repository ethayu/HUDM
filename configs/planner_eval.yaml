experiment:
  name: "multi_backend_compare"
  shared_plan:
    imports:
      - task/pusht_dataset.yaml
      - planner/default.yaml
    plan:
      artifacts:
        render: false
        save: false
  rollouts:
    seed: 0
    num_rollouts: 4
    sample_without_replacement: true
  execution:
    mode: "auto"
    max_workers: 2
  reporting:
    output_root: "rollouts"
  baseline: "gt_env_finest"
  variants:
    - name: "gt_env_finest"
      imports:
        - backend/gt_env_image.yaml
        - fidelity/finest.yaml
    - name: "gt_env_coarse_to_fine"
      imports:
        - backend/gt_env_image.yaml
        - fidelity/coarse_to_fine.yaml
    - name: "particle_finest"
      imports:
        - backend/particle_state.yaml
        - fidelity/finest.yaml
