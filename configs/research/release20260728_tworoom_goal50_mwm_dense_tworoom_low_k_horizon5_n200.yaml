# goal_offset=50 counterpart of release20260728_tworoom_goal25_mwm_dense_tworoom_low_k_horizon5_n200.yaml.
# Extends the dense-matched-K line below K=96 using checkpoints_mwm/mwm_dense_tworoom
# (K=[6,12,48,96,144,192]) for its K=6/12/48 levels only (K=96/144/192 covered by the
# paper10 checkpoint in release20260728_tworoom_goal50_k_matched_comparison_horizon5_n200.yaml).
#
# Same eval protocol as the goal25 version: horizon=5/receding_horizon=5,
# pop=300/elite=0.1/n_iter=10, 200 episodes, but goal_offset=50/budget=100 and a
# freshly auto-generated n=200 manifest at goal_offset=50.
output_dir: reports/research/release20260728_tworoom_goal50_mwm_dense_tworoom_low_k_horizon5_n200
title: Release 2026-07-28 TwoRoom Goal50 -- mwm_dense_tworoom Low-K (6/12/48), Horizon5, N=200
env_id: swm/TwoRoom-v1
seed: 42
eval_config: configs/eval/paper_tworoom.yaml
manifest:
  config: configs/manifest/release20260728_tworoom_goal50_exact_seed42_n200.yaml

run_defaults:
  eval:
    episodes: 200
    num_envs: 50
    goal_offset: 50
    goal_indexing: exact
    budget: 100
  planner:
    flop_accounting: dynamics_audit
    horizon: 5
    receding_horizon: 5
    action_block: 5
    pop_size: 300
    elite_frac: 0.1
    n_iter: 10

runs:
  - name: mwm_dense_tworoom_k6
    role: tworoom_goal50_mwm_dense_tworoom_k6_horizon5_n200
    checkpoint: &mwm_dense_tworoom_checkpoint checkpoints_mwm/mwm_dense_tworoom
    schedule: "mwm_dense_tworoom checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=6 (level 0) | horizon=5, n=200"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 0}
        cem: {mode: fixed, level: 0}
        rollout: {mode: fixed, level: 0}

  - name: mwm_dense_tworoom_k12
    role: tworoom_goal50_mwm_dense_tworoom_k12_horizon5_n200
    checkpoint: *mwm_dense_tworoom_checkpoint
    schedule: "mwm_dense_tworoom checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=12 (level 1) | horizon=5, n=200"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 1}
        cem: {mode: fixed, level: 1}
        rollout: {mode: fixed, level: 1}

  - name: mwm_dense_tworoom_k48
    role: tworoom_goal50_mwm_dense_tworoom_k48_horizon5_n200
    checkpoint: *mwm_dense_tworoom_checkpoint
    schedule: "mwm_dense_tworoom checkpoint (K=[6,12,48,96,144,192]) | MPC/CEM/Rollout all fixed at K=48 (level 2) | horizon=5, n=200"
    planner:
      scheduler:
        enabled: true
        mpc: {mode: fixed, level: 2}
        cem: {mode: fixed, level: 2}
        rollout: {mode: fixed, level: 2}
